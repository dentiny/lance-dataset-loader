[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "lance-dataset-loader"
version = "0.1.0"
description = "Deterministic, resumable mixtures of versioned Lance datasets"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
dependencies = ["pylance>=0.30.0"]

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.9"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
